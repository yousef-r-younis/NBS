<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBS AI Art Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1A154F 0%, #2a1f6f 50%, #1A154F 100%);
            padding: 20px 2rem 2rem 2rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .logo img {
            width: 70px;
            height: 70px;
            object-fit: contain;
        }

        .title-section h1 {
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.25rem;
        }

        .title-section p {
            color: #F5BA38;
            font-size: 1.25rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .control-btn {
            background: rgba(255,255,255,0.1);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .play-btn {
            background: #F5BA38;
            color: #1A154F;
        }

        .play-btn:hover {
            background: #f5c855;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 1024px) {
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }

        .card-container {
            aspect-ratio: 1;
            perspective: 1000px;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s;
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }

        .card-front {
            background: white;
            overflow: hidden;
        }

        .card-image {
            height: 75%;
            background: linear-gradient(135deg, #e5e7eb 0%, #d1d5db 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6b7280;
            font-size: 0.875rem;
        }

        .card-info {
            height: 25%;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .student-name {
            color: #1A154F;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.25rem;
        }

        .click-hint {
            color: #9ca3af;
            font-size: 0.75rem;
        }

        .card-back {
            background: linear-gradient(135deg, #F5BA38 0%, #f5c855 100%);
            transform: rotateY(180deg);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .prompt-title {
            color: #1A154F;
            font-weight: bold;
            font-size: 1.125rem;
            margin-bottom: 1rem;
        }

        .prompt-text {
            color: #1A154F;
            font-size: 0.875rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .prompt-author {
            color: rgba(26, 21, 79, 0.7);
            font-size: 0.75rem;
            margin-top: auto;
        }

        .flip-hint {
            color: rgba(26, 21, 79, 0.5);
            font-size: 0.75rem;
            margin-top: 1rem;
        }

        .indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .indicator {
            height: 8px;
            width: 8px;
            background: rgba(255,255,255,0.3);
            border-radius: 9999px;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator:hover {
            background: rgba(255,255,255,0.5);
        }

        .indicator.active {
            width: 32px;
            background: #F5BA38;
        }

        .slide {
            display: none;
        }

        .slide.active {
            display: block;
        }

        svg {
            width: 24px;
            height: 24px;
        }
    </style>
</head>
<body>

            <div class="logo-section">
                <div class="logo">

                </div>
                <div class="title-section">

            <div class="controls">
                <button class="control-btn play-btn" id="playPauseBtn" onclick="toggleAutoPlay()">
                    <svg id="pauseIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-li necap="round" stroke-linejoin="round" stroke-width="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <svg id="playIcon" style="display:none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </button>
                <button class="control-btn" onclick="prevSlide()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                    </svg>
                </button>
                <button class="control-btn" onclick="nextSlide()">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                    </svg>
                </button>
            </div>
        </div>

        <div id="galleryContainer"></div>

        <div class="indicators" id="indicators"></div>
    </div>

                },
                prompts: {
                    '4c-1-pr': 'Draw a cute pink flamingo that is dancing with a rainbow and a lake. The sky is blue without sun. The ground is full of red and yellow flowers with a cute girl.',
                    '4c-2-pr': 'Draw many dragons flying around a house with a robot, flowers, people, and blue sky with pink birds and trees.',

                    '4c-6-pr': 'Draw a chef in a restaurant toilet with a monster killing the people and the chef is giving the monster medicine.',
                    
                }
            }
        };

        var classes = ['3A', '3B', '3C', '4A', '4B', '4C'];
        var currentSlide = 0;
        var isAutoPlay = true;
        var autoPlayTimer;

        function createGallery() {
            var container = document.getElementById('galleryContainer');
            var indicatorsContainer = document.getElementById('indicators');
            
            for (var i = 0; i < classes.length; i++) {
                var className = classes[i];
                var data = galleryData[className];
                var slideDiv = document.createElement('div');
                slideDiv.className = 'slide' + (i === 0 ? ' active' : '');
                slideDiv.id = 'slide-' + i;
                
                var gridDiv = document.createElement('div');
                gridDiv.className = 'gallery-grid';
                
                for (var j = 0; j < data.images.length; j++) {
                    var img = data.images[j];
                    var studentKey = className.toLowerCase() + '-' + (j + 1) + '-st';
                    var promptKey = className.toLowerCase() + '-' + (j + 1) + '-pr';
                    
                    var cardContainer = document.createElement('div');
                    cardContainer.className = 'card-container';
                    cardContainer.setAttribute('data-slide', i);
                    cardContainer.setAttribute('data-card', j);
                    cardContainer.onclick = function() {
                        var slideIdx = parseInt(this.getAttribute('data-slide'));
                        var cardIdx = parseInt(this.getAttribute('data-card'));
                        toggleCard(slideIdx, cardIdx);
                    };
                    
                    cardContainer.innerHTML = 
                        '<div class="card" id="card-' + i + '-' + j + '">' +
                            '<div class="card-face card-front">' +
                                '<div class="card-image"><img src="pics/' + img + '" alt="' + className + ' Artwork ' + (j + 1) + '" style="width: 100%; height: 100%; object-fit: cover;"></div>' +
                                '<div class="card-info">' +
                                    '<div class="student-name">' + data.students[studentKey] + '</div>' +
                                    '<div class="click-hint">Click to view prompt</div>' +
                                '</div>' +
                            '</div>' +
                            '<div class="card-face card-back">' +
                                '<div class="prompt-title">AI Prompt</div>' +
                                '<div class="prompt-text">"' + data.prompts[promptKey] + '"</div>' +
                                '<div class="prompt-author">- ' + data.students[studentKey] + '</div>' +
                                '<div class="flip-hint">Click to flip back</div>' +
                            '</div>' +
                        '</div>';
                    
                    gridDiv.appendChild(cardContainer);
                }
                
                slideDiv.appendChild(gridDiv);
                container.appendChild(slideDiv);
                
                var indicator = document.createElement('button');
                indicator.className = 'indicator' + (i === 0 ? ' active' : '');
                indicator.setAttribute('data-slide', i);
                indicator.onclick = function() {
                    var idx = parseInt(this.getAttribute('data-slide'));
                    goToSlide(idx);
                };
                indicatorsContainer.appendChild(indicator);
            }
        }

        function toggleCard(slideIdx, cardIdx) {
            var card = document.getElementById('card-' + slideIdx + '-' + cardIdx);
            if (card.classList.contains('flipped')) {
                card.classList.remove('flipped');
            } else {
                card.classList.add('flipped');
            }
        }

        function updateSlide() {
            var slides = document.querySelectorAll('.slide');
            for (var i = 0; i < slides.length; i++) {
                if (i === currentSlide) {
                    slides[i].classList.add('active');
                } else {
                    slides[i].classList.remove('active');
                }
            }
            
            var indicators = document.querySelectorAll('.indicator');
            for (var i = 0; i < indicators.length; i++) {
                if (i === currentSlide) {
                    indicators[i].classList.add('active');
                } else {
                    indicators[i].classList.remove('active');
                }
            }
            
            document.getElementById('currentClass').textContent = 'Class ' + classes[currentSlide];
            
            var cards = document.querySelectorAll('.card');
            for (var i = 0; i < cards.length; i++) {
                cards[i].classList.remove('flipped');
            }
        }

        function nextSlide() {
            currentSlide = (currentSlide + 1) % classes.length;
            updateSlide();
        }

        function prevSlide() {
            currentSlide = (currentSlide - 1 + classes.length) % classes.length;
            updateSlide();
        }

        function goToSlide(idx) {
            currentSlide = idx;
            updateSlide();
        }

        function toggleAutoPlay() {
            isAutoPlay = !isAutoPlay;
            if (isAutoPlay) {
                document.getElementById('pauseIcon').style.display = 'block';
                document.getElementById('playIcon').style.display = 'none';
                startAutoPlay();
            } else {
                document.getElementById('pauseIcon').style.display = 'none';
                document.getElementById('playIcon').style.display = 'block';
                stopAutoPlay();
            }
        }

        function startAutoPlay() {
            autoPlayTimer = setInterval(nextSlide, 5000);
        }

        function stopAutoPlay() {
            clearInterval(autoPlayTimer);
        }

        createGallery();
        startAutoPlay();
    </script>
</body>
</html>
